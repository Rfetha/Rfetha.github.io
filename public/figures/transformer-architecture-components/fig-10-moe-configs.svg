<svg viewBox="0 0 1000 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t10">
  <title id="t10">Beş Mixture-of-Experts konfigürasyonu bir dağılım grafiğinde. Yatay eksen katman başına toplam uzman sayısı, ikinin katları olarak logaritmik; dikey eksen token başına aktif uzman sayısı. Switch Transformer sağ altta, 2048 uzmandan yalnız 1'i aktif. gpt-oss-20b 32 uzmandan 4, gpt-oss-120b 128'den 4, Qwen3 128'den 8, DeepSeek-V3 257'den 9 -- birini hep açık paylaşılan uzman. Noktalar dağınık; ne toplam uzman sayısında ne aktif sayıda ortak bir seçim var.</title>
  <style>
    .ser { font-family: Georgia, 'Times New Roman', serif; }
    .mon { font-family: Consolas, Menlo, monospace; }
  </style>

  <text class="ser" x="60" y="48" font-size="15" fill="#1a1a1a">Beş model, beş konfigürasyon</text>
  <text class="ser" x="60" y="68" font-size="12.6" font-style="italic" fill="#6e6e6e">MoE katmanı başına toplam uzman, ve token başına kaçının açık olduğu</text>

  <line x1="165.0" y1="84" x2="165.0" y2="268" stroke="#ececec" stroke-width="1"/><text class="mon" x="165.0" y="288" font-size="10.8" fill="#6e6e6e" text-anchor="middle">32</text><line x1="284.2" y1="84" x2="284.2" y2="268" stroke="#ececec" stroke-width="1"/><text class="mon" x="284.2" y="288" font-size="10.8" fill="#6e6e6e" text-anchor="middle">64</text><line x1="403.3" y1="84" x2="403.3" y2="268" stroke="#ececec" stroke-width="1"/><text class="mon" x="403.3" y="288" font-size="10.8" fill="#6e6e6e" text-anchor="middle">128</text><line x1="522.5" y1="84" x2="522.5" y2="268" stroke="#ececec" stroke-width="1"/><text class="mon" x="522.5" y="288" font-size="10.8" fill="#6e6e6e" text-anchor="middle">256</text><line x1="641.7" y1="84" x2="641.7" y2="268" stroke="#ececec" stroke-width="1"/><text class="mon" x="641.7" y="288" font-size="10.8" fill="#6e6e6e" text-anchor="middle">512</text><line x1="760.8" y1="84" x2="760.8" y2="268" stroke="#ececec" stroke-width="1"/><text class="mon" x="760.8" y="288" font-size="10.8" fill="#6e6e6e" text-anchor="middle">1024</text><line x1="880.0" y1="84" x2="880.0" y2="268" stroke="#ececec" stroke-width="1"/><text class="mon" x="880.0" y="288" font-size="10.8" fill="#6e6e6e" text-anchor="middle">2048</text>
  <line x1="165" y1="268" x2="880" y2="268" stroke="#dadada" stroke-width="1"/>
  <line x1="165" y1="84" x2="165" y2="268" stroke="#dadada" stroke-width="1"/>
  <line x1="159" y1="268.0" x2="165" y2="268.0" stroke="#dadada" stroke-width="1"/><text class="mon" x="152" y="272.0" font-size="10.8" fill="#6e6e6e" text-anchor="end">0</text><line x1="159" y1="232.8" x2="165" y2="232.8" stroke="#dadada" stroke-width="1"/><text class="mon" x="152" y="236.8" font-size="10.8" fill="#6e6e6e" text-anchor="end">2</text><line x1="159" y1="197.6" x2="165" y2="197.6" stroke="#dadada" stroke-width="1"/><text class="mon" x="152" y="201.6" font-size="10.8" fill="#6e6e6e" text-anchor="end">4</text><line x1="159" y1="162.4" x2="165" y2="162.4" stroke="#dadada" stroke-width="1"/><text class="mon" x="152" y="166.4" font-size="10.8" fill="#6e6e6e" text-anchor="end">6</text><line x1="159" y1="127.2" x2="165" y2="127.2" stroke="#dadada" stroke-width="1"/><text class="mon" x="152" y="131.2" font-size="10.8" fill="#6e6e6e" text-anchor="end">8</text><line x1="159" y1="92.0" x2="165" y2="92.0" stroke="#dadada" stroke-width="1"/><text class="mon" x="152" y="96.0" font-size="10.8" fill="#6e6e6e" text-anchor="end">10</text>
  <text class="ser" x="522.5" y="310" font-size="12.6" font-style="italic" fill="#454545" text-anchor="middle">katman başına toplam uzman (log)</text>
  <text class="ser" x="121" y="180.0" font-size="12.6" font-style="italic" fill="#454545" text-anchor="middle" transform="rotate(-90 121 180.0)">token başına aktif</text>

  <circle cx="880.0" cy="250.4" r="4.6" fill="#1a1a1a"/><text class="ser" x="880.0" y="231.4" font-size="13.2" fill="#1a1a1a" text-anchor="end">Switch Transformer</text><text class="mon" x="880.0" y="246.4" font-size="10.2" fill="#6e6e6e" text-anchor="end">2021 · 2048 / 1 aktif</text><circle cx="165.0" cy="197.6" r="4.6" fill="#1a1a1a"/><text class="ser" x="179.0" y="202.6" font-size="13.2" fill="#1a1a1a" text-anchor="start">gpt-oss-20b</text><text class="mon" x="179.0" y="217.6" font-size="10.2" fill="#6e6e6e" text-anchor="start">2025 · 32 / 4 aktif</text><circle cx="403.3" cy="197.6" r="4.6" fill="#1a1a1a"/><text class="ser" x="417.3" y="202.6" font-size="13.2" fill="#1a1a1a" text-anchor="start">gpt-oss-120b</text><text class="mon" x="417.3" y="217.6" font-size="10.2" fill="#6e6e6e" text-anchor="start">2025 · 128 / 4 aktif</text><circle cx="403.3" cy="127.2" r="4.6" fill="#1a1a1a"/><text class="ser" x="389.3" y="132.2" font-size="13.2" fill="#1a1a1a" text-anchor="end">Qwen3-235B-A22B</text><text class="mon" x="389.3" y="147.2" font-size="10.2" fill="#6e6e6e" text-anchor="end">2025 · 128 / 8 aktif</text><circle cx="523.2" cy="109.6" r="4.6" fill="#8c1515"/><text class="ser" x="537.2" y="114.6" font-size="13.2" fill="#8c1515" text-anchor="start">DeepSeek-V3</text><text class="mon" x="537.2" y="129.6" font-size="10.2" fill="#6e6e6e" text-anchor="start">2024 · 257 / 9 aktif</text>
  <text class="ser" x="537.2" y="144.6" font-size="11.4" font-style="italic" fill="#8c1515">1'i hep açık paylaşılan uzman</text>

  <line x1="60" y1="322" x2="940" y2="322" stroke="#dadada" stroke-width="1"/>
  <text class="ser" x="60" y="344" font-size="12.6" font-style="italic" fill="#454545">Yakınsanan bir sayı yok. Switch'in tüm tezi top-1'di; bugün kimse orada değil, ama birbirlerinde de değiller.</text>
</svg>
