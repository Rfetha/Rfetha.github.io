<svg viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t5">
  <title id="t5">How reach widens layer by layer in a sliding window. The vertical line on the right is the querying token. Six horizontal bars show the backward reach that token can indirectly cover after one, two, four, eight, sixteen and thirty-two layers. In a single layer the direct view is only 4096 tokens, but it grows multiplied by the layer count: after thirty-two layers, 131,072 tokens. The scale is linear, 24 pixels per 4096 tokens. Mistral 7B's own configuration and its own arithmetic.</title>
  <style>
    .ser { font-family: Georgia, 'Times New Roman', serif; }
    .mon { font-family: Consolas, Menlo, monospace; }
  </style>

  <text class="ser" x="60" y="50" font-size="15" fill="#1a1a1a">The window is narrow, the reach is not</text>
  <text class="ser" x="60" y="68" font-size="12.6" font-style="italic" fill="#6e6e6e">Mistral 7B — window W = 4096, 32 layers</text>

  <line x1="880" y1="88" x2="880" y2="264" stroke="#1a1a1a" stroke-width="1.2"/>
  <text class="ser" x="890" y="84" font-size="12.6" fill="#1a1a1a">querying token</text>

  <line x1="856.0" y1="250" x2="880" y2="250" stroke="#1a1a1a" stroke-width="2.5"/><line x1="856.0" y1="245" x2="856.0" y2="255" stroke="#1a1a1a" stroke-width="1"/><text class="mon" x="847.0" y="254" font-size="11.4" fill="#6e6e6e" text-anchor="end">4,096</text><text class="mon" x="890" y="254" font-size="11.4" fill="#454545">ℓ = 1</text><line x1="832.0" y1="220" x2="880" y2="220" stroke="#1a1a1a" stroke-width="2.5"/><line x1="832.0" y1="215" x2="832.0" y2="225" stroke="#1a1a1a" stroke-width="1"/><text class="mon" x="823.0" y="224" font-size="11.4" fill="#6e6e6e" text-anchor="end">8,192</text><text class="mon" x="890" y="224" font-size="11.4" fill="#454545">ℓ = 2</text><line x1="784.0" y1="190" x2="880" y2="190" stroke="#1a1a1a" stroke-width="2.5"/><line x1="784.0" y1="185" x2="784.0" y2="195" stroke="#1a1a1a" stroke-width="1"/><text class="mon" x="775.0" y="194" font-size="11.4" fill="#6e6e6e" text-anchor="end">16,384</text><text class="mon" x="890" y="194" font-size="11.4" fill="#454545">ℓ = 4</text><line x1="688.0" y1="160" x2="880" y2="160" stroke="#1a1a1a" stroke-width="2.5"/><line x1="688.0" y1="155" x2="688.0" y2="165" stroke="#1a1a1a" stroke-width="1"/><text class="mon" x="679.0" y="164" font-size="11.4" fill="#6e6e6e" text-anchor="end">32,768</text><text class="mon" x="890" y="164" font-size="11.4" fill="#454545">ℓ = 8</text><line x1="496.0" y1="130" x2="880" y2="130" stroke="#1a1a1a" stroke-width="2.5"/><line x1="496.0" y1="125" x2="496.0" y2="135" stroke="#1a1a1a" stroke-width="1"/><text class="mon" x="487.0" y="134" font-size="11.4" fill="#6e6e6e" text-anchor="end">65,536</text><text class="mon" x="890" y="134" font-size="11.4" fill="#454545">ℓ = 16</text><line x1="112.0" y1="100" x2="880" y2="100" stroke="#8c1515" stroke-width="2.5"/><line x1="112.0" y1="95" x2="112.0" y2="105" stroke="#8c1515" stroke-width="1"/><text class="mon" x="103.0" y="104" font-size="11.4" fill="#6e6e6e" text-anchor="end">131,072</text><text class="mon" x="890" y="104" font-size="11.4" fill="#454545">ℓ = 32</text>

  <text class="mon" x="200" y="276" font-size="10.8" fill="#6e6e6e">tokens back</text>

  
  <text class="ser" x="840" y="276" font-size="11.4" font-style="italic" fill="#454545" text-anchor="end">↑ a single layer sees directly only this far</text>

  <text class="ser" x="60" y="308" font-size="13.2" font-style="italic" fill="#454545">If information travels W tokens in one layer, after k layers it has travelled k × W. The window limits direct reach within one layer;</text>
  <text class="ser" x="60" y="324" font-size="13.2" font-style="italic" fill="#454545">the stack keeps the indirect path open. The scale is linear — 24 pixels = 4096 tokens.</text>
</svg>
