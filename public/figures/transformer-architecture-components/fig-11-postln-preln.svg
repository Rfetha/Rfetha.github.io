<svg viewBox="0 0 1000 574" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t11">
  <title id="t11">İki blok şeması yan yana, her biri iki katman gösteriyor. Solda Post-LN, 2017'nin orijinali: alt katman çalışır, artık toplanır, sonra normalizasyon uygulanır. Normalizasyon kutusu ana yolun üzerinde durur, yani artık akışı her katmanda yeniden ölçeklenir. Sağda Pre-LN, bugün sevk edilen: önce bir kopya normalize edilir, alt katman ona uygulanır, sonuç dokunulmamış artığa eklenir. Normalizasyon dalın içindedir ve ana yol baştan sona kesintisiz bir kimlik olarak kalır. Sağdaki şemada dikey ana çizgi hiçbir kutu tarafından kesilmiyor.</title>
  <style>
    .ser { font-family: Georgia, 'Times New Roman', serif; }
    .mon { font-family: Consolas, Menlo, monospace; }
  </style>

  <text class="ser" x="110" y="66" font-size="15" fill="#1a1a1a">Post-LN</text><text class="ser" x="110" y="84" font-size="12.6" font-style="italic" fill="#6e6e6e">2017'nin orijinali</text><text class="mon" x="110" y="108" font-size="12" fill="#454545">x = LayerNorm( x + Sublayer(x) )</text><line x1="150" y1="140" x2="150" y2="231" stroke="#1a1a1a" stroke-width="3"/><path d="M 150 140 H 300 V 168" fill="none" stroke="#454545" stroke-width="1"/><rect x="234" y="168" width="132" height="36" fill="none" stroke="#454545" stroke-width="1"/><text class="mon" x="300" y="190" font-size="12" fill="#454545" text-anchor="middle">Sublayer</text><path d="M 300 204 V 240 H 159" fill="none" stroke="#454545" stroke-width="1"/><circle cx="150" cy="240" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/><text class="mon" x="150" y="244" font-size="13.2" fill="#1a1a1a" text-anchor="middle">+</text><rect x="84" y="262" width="132" height="36" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><text class="mon" x="150" y="284" font-size="12" fill="#8c1515" text-anchor="middle">LayerNorm</text><line x1="150" y1="249" x2="150" y2="262" stroke="#1a1a1a" stroke-width="3"/><line x1="150" y1="298" x2="150" y2="308" stroke="#1a1a1a" stroke-width="3"/><line x1="150" y1="308" x2="150" y2="399" stroke="#1a1a1a" stroke-width="3"/><path d="M 150 308 H 300 V 336" fill="none" stroke="#454545" stroke-width="1"/><rect x="234" y="336" width="132" height="36" fill="none" stroke="#454545" stroke-width="1"/><text class="mon" x="300" y="358" font-size="12" fill="#454545" text-anchor="middle">Sublayer</text><path d="M 300 372 V 408 H 159" fill="none" stroke="#454545" stroke-width="1"/><circle cx="150" cy="408" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/><text class="mon" x="150" y="412" font-size="13.2" fill="#1a1a1a" text-anchor="middle">+</text><rect x="84" y="430" width="132" height="36" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><text class="mon" x="150" y="452" font-size="12" fill="#8c1515" text-anchor="middle">LayerNorm</text><line x1="150" y1="417" x2="150" y2="430" stroke="#1a1a1a" stroke-width="3"/><line x1="150" y1="466" x2="150" y2="476" stroke="#1a1a1a" stroke-width="3"/><text class="mon" x="136" y="146" font-size="11.4" fill="#6e6e6e" text-anchor="end">x</text><line x1="150" y1="476" x2="150" y2="492" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="500" y1="56" x2="500" y2="512" stroke="#dadada" stroke-width="1"/>
  <text class="ser" x="600" y="66" font-size="15" fill="#1a1a1a">Pre-LN</text><text class="ser" x="600" y="84" font-size="12.6" font-style="italic" fill="#6e6e6e">bugün sevk edilen</text><text class="mon" x="600" y="108" font-size="12" fill="#454545">x = x + Sublayer( LayerNorm(x) )</text><line x1="640" y1="140" x2="640" y2="308" stroke="#8c1515" stroke-width="3"/><path d="M 640 140 H 790 V 162" fill="none" stroke="#454545" stroke-width="1"/><rect x="724" y="162" width="132" height="34" fill="none" stroke="#454545" stroke-width="1"/><text class="mon" x="790" y="183" font-size="12" fill="#454545" text-anchor="middle">LayerNorm</text><line x1="790" y1="196" x2="790" y2="212" stroke="#454545" stroke-width="1"/><rect x="724" y="212" width="132" height="36" fill="none" stroke="#454545" stroke-width="1"/><text class="mon" x="790" y="234" font-size="12" fill="#454545" text-anchor="middle">Sublayer</text><path d="M 790 248 V 272 H 649" fill="none" stroke="#454545" stroke-width="1"/><circle cx="640" cy="272" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/><text class="mon" x="640" y="276" font-size="13.2" fill="#1a1a1a" text-anchor="middle">+</text><line x1="640" y1="308" x2="640" y2="476" stroke="#8c1515" stroke-width="3"/><path d="M 640 308 H 790 V 330" fill="none" stroke="#454545" stroke-width="1"/><rect x="724" y="330" width="132" height="34" fill="none" stroke="#454545" stroke-width="1"/><text class="mon" x="790" y="351" font-size="12" fill="#454545" text-anchor="middle">LayerNorm</text><line x1="790" y1="364" x2="790" y2="380" stroke="#454545" stroke-width="1"/><rect x="724" y="380" width="132" height="36" fill="none" stroke="#454545" stroke-width="1"/><text class="mon" x="790" y="402" font-size="12" fill="#454545" text-anchor="middle">Sublayer</text><path d="M 790 416 V 440 H 649" fill="none" stroke="#454545" stroke-width="1"/><circle cx="640" cy="440" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/><text class="mon" x="640" y="444" font-size="13.2" fill="#1a1a1a" text-anchor="middle">+</text><text class="mon" x="626" y="146" font-size="11.4" fill="#6e6e6e" text-anchor="end">x</text><line x1="640" y1="476" x2="640" y2="492" stroke="#8c1515" stroke-width="3"/>

  <text class="ser" x="110" y="518" font-size="12.6" font-style="italic" fill="#8c1515">Norm ana yolun üstünde: artık akışı her katmanda yeniden ölçekleniyor.</text>
  <text class="ser" x="600" y="518" font-size="12.6" font-style="italic" fill="#8c1515">Norm dalın içinde: ana yol kesintisiz bir kimlik.</text>

  <line x1="60" y1="536" x2="940" y2="536" stroke="#dadada" stroke-width="1"/>
  <text class="ser" x="60" y="556" font-size="12.6" font-style="italic" fill="#454545">Pre-LN kaliteyle kazanmadı: ısınma aşamasını kaldırılabilir kıldığı için kazandı. Bedeli, yığının tepesine eklenmesi gereken son bir normalizasyon.</text>
</svg>
