<svg viewBox="0 0 1000 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t7">
  <title id="t7">KV-cache footprint per token for four attention mechanisms, on DeepSeek-V3's published configuration: 61 layers, 128 heads, 128 dimensions per head. The bars are on a linear scale. MHA 1,998,848 elements and 488 GiB at 128K context; GQA-8 124,928 elements and 30.5 GiB; MQA 15,616 elements and 3.8 GiB; MLA 35,136 elements and 8.6 GiB. MLA's bar is one fifty-seventh of MHA's. The capacity labels on the right come from DeepSeek's own table, not an independent measurement.</title>
  <style>
    .ser { font-family: Georgia, 'Times New Roman', serif; }
    .mon { font-family: Consolas, Menlo, monospace; }
  </style>

  <text class="ser" x="60" y="52" font-size="15" fill="#1a1a1a">KV-cache per token</text>
  <text class="ser" x="60" y="72" font-size="12" font-style="italic" fill="#6e6e6e">DeepSeek-V3's configuration — 61 layers, 128 heads, 128 dims per head</text>

  <text class="ser" x="700" y="118" font-size="11" font-style="italic" fill="#6e6e6e" text-anchor="end">elements / token</text>
  <text class="ser" x="828" y="118" font-size="11" font-style="italic" fill="#6e6e6e" text-anchor="end">GiB · 128K</text>
  <text class="ser" x="940" y="118" font-size="11" font-style="italic" fill="#6e6e6e" text-anchor="end">capacity</text>
  <line x1="168" y1="124" x2="940" y2="124" stroke="#dadada" stroke-width="1"/>

  <text class="mon" x="150" y="145" font-size="13" fill="#1a1a1a" text-anchor="end">MHA</text><text class="mon" x="150" y="160" font-size="10.5" fill="#6e6e6e" text-anchor="end">2 nh dh l</text><rect x="168" y="132" width="392.0" height="18" fill="#1a1a1a"/><text class="mon" x="700" y="145" font-size="12" fill="#454545" text-anchor="end">1,998,848</text><text class="mon" x="828" y="145" font-size="12" fill="#1a1a1a" text-anchor="end">488.0</text><text class="ser" x="940" y="145" font-size="12" font-style="italic" fill="#6e6e6e" text-anchor="end">Strong</text><text class="mon" x="150" y="193" font-size="13" fill="#1a1a1a" text-anchor="end">GQA-8</text><text class="mon" x="150" y="208" font-size="10.5" fill="#6e6e6e" text-anchor="end">2 ng dh l</text><rect x="168" y="180" width="24.5" height="18" fill="#1a1a1a"/><text class="mon" x="700" y="193" font-size="12" fill="#454545" text-anchor="end">124,928</text><text class="mon" x="828" y="193" font-size="12" fill="#1a1a1a" text-anchor="end">30.5</text><text class="ser" x="940" y="193" font-size="12" font-style="italic" fill="#6e6e6e" text-anchor="end">Medium</text><text class="mon" x="150" y="241" font-size="13" fill="#1a1a1a" text-anchor="end">MQA</text><text class="mon" x="150" y="256" font-size="10.5" fill="#6e6e6e" text-anchor="end">2 dh l</text><rect x="168" y="228" width="3.1" height="18" fill="#1a1a1a"/><text class="mon" x="700" y="241" font-size="12" fill="#454545" text-anchor="end">15,616</text><text class="mon" x="828" y="241" font-size="12" fill="#1a1a1a" text-anchor="end">3.8</text><text class="ser" x="940" y="241" font-size="12" font-style="italic" fill="#6e6e6e" text-anchor="end">Weak</text><text class="mon" x="150" y="289" font-size="13" fill="#8c1515" text-anchor="end">MLA</text><text class="mon" x="150" y="304" font-size="10.5" fill="#6e6e6e" text-anchor="end">(dc + dhR) l</text><rect x="168" y="276" width="6.9" height="18" fill="#8c1515"/><text class="mon" x="700" y="289" font-size="12" fill="#454545" text-anchor="end">35,136</text><text class="mon" x="828" y="289" font-size="12" fill="#8c1515" text-anchor="end">8.6</text><text class="ser" x="940" y="289" font-size="12" font-style="italic" fill="#6e6e6e" text-anchor="end">Stronger</text>

  <line x1="60" y1="312" x2="940" y2="312" stroke="#dadada" stroke-width="1"/>
  <text class="ser" x="60" y="334" font-size="12" font-style="italic" fill="#454545">The GiB column is a single request, bf16. Only MLA shipped; the other three are the same model built with that mechanism.</text>
  <text class="ser" x="60" y="350" font-size="12" font-style="italic" fill="#454545">Capacity labels come from DeepSeek's own table — not an independent measurement.</text>
</svg>
