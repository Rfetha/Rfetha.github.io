<svg viewBox="0 0 1000 296" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3">
  <title id="t3">İki kutu dizisi aynı toplam genişlikte. Solda tek bir geniş attention kafası, 512 boyutunda. Sağda sekiz dar kafa, her biri 64 boyutunda; sekizinin toplamı yine 512. Altta 512 eşittir 8 çarpı 64 yazıyor. Sağ altta 2017 ablasyonundan gelen şerh: kafa başına boyutu küçültmek kaliteyi düşürüyor, o yüzden ucuzlatmanın yolu bu eksen değil.</title>
  <style>
    .ser { font-family: Georgia, 'Times New Roman', serif; }
    .mon { font-family: Consolas, Menlo, monospace; }
  </style>

  <text class="ser" x="80" y="76" font-size="14.4" fill="#1a1a1a">Tek geniş kafa</text>
  <text class="mon" x="80" y="93" font-size="12" fill="#6e6e6e">h = 1</text>
  <rect x="80" y="120" width="380" height="46" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text class="mon" x="270" y="150" font-size="13.2" fill="#454545" text-anchor="middle">512</text>

  <text class="ser" x="540" y="76" font-size="14.4" fill="#1a1a1a">Sekiz dar kafa</text>
  <text class="mon" x="540" y="93" font-size="12" fill="#6e6e6e">h = 8</text>
  <rect x="540.0" y="120" width="46.5" height="46" fill="none" stroke="#1a1a1a" stroke-width="1"/><rect x="587.5" y="120" width="46.5" height="46" fill="none" stroke="#1a1a1a" stroke-width="1"/><rect x="635.0" y="120" width="46.5" height="46" fill="none" stroke="#1a1a1a" stroke-width="1"/><rect x="682.5" y="120" width="46.5" height="46" fill="none" stroke="#1a1a1a" stroke-width="1"/><rect x="730.0" y="120" width="46.5" height="46" fill="none" stroke="#1a1a1a" stroke-width="1"/><rect x="777.5" y="120" width="46.5" height="46" fill="none" stroke="#1a1a1a" stroke-width="1"/><rect x="825.0" y="120" width="46.5" height="46" fill="none" stroke="#1a1a1a" stroke-width="1"/><rect x="872.5" y="120" width="46.5" height="46" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text class="mon" x="563.2" y="150" font-size="10.8" fill="#6e6e6e" text-anchor="middle">64</text><text class="mon" x="610.7" y="150" font-size="10.8" fill="#6e6e6e" text-anchor="middle">64</text><text class="mon" x="658.2" y="150" font-size="10.8" fill="#6e6e6e" text-anchor="middle">64</text><text class="mon" x="705.7" y="150" font-size="10.8" fill="#6e6e6e" text-anchor="middle">64</text><text class="mon" x="753.2" y="150" font-size="10.8" fill="#6e6e6e" text-anchor="middle">64</text><text class="mon" x="800.7" y="150" font-size="10.8" fill="#6e6e6e" text-anchor="middle">64</text><text class="mon" x="848.2" y="150" font-size="10.8" fill="#6e6e6e" text-anchor="middle">64</text><text class="mon" x="895.7" y="150" font-size="10.8" fill="#6e6e6e" text-anchor="middle">64</text>

  <line x1="80" y1="188" x2="460" y2="188" stroke="#dadada" stroke-width="1"/>
  <line x1="540" y1="188" x2="920" y2="188" stroke="#dadada" stroke-width="1"/>
  <line x1="80" y1="184" x2="80" y2="192" stroke="#dadada" stroke-width="1"/>
  <line x1="460" y1="184" x2="460" y2="192" stroke="#dadada" stroke-width="1"/>
  <line x1="540" y1="184" x2="540" y2="192" stroke="#dadada" stroke-width="1"/>
  <line x1="920" y1="184" x2="920" y2="192" stroke="#dadada" stroke-width="1"/>
  <text class="ser" x="270" y="207" font-size="13.2" font-style="italic" fill="#6e6e6e" text-anchor="middle">aynı toplam genişlik</text>
  <text class="ser" x="730" y="207" font-size="13.2" font-style="italic" fill="#6e6e6e" text-anchor="middle">aynı toplam genişlik</text>

  <text class="mon" x="500" y="243" font-size="14.4" fill="#1a1a1a" text-anchor="middle">512 = 8 × 64</text>
  <text class="ser" x="500" y="264" font-size="13.2" font-style="italic" fill="#454545" text-anchor="middle">Kazanılan kapasite değil, çeşitlilik: sekiz ayrı alt uzayda sekiz ayrı ilişki.</text>
  <text class="ser" x="500" y="284" font-size="12" font-style="italic" fill="#8c1515" text-anchor="middle">2017'nin kendi ablasyonu: bu kutuları daraltmak kaliteyi düşürüyor — §4 başka bir düğmeye basacak.</text>
</svg>
