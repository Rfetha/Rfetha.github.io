<svg viewBox="0 0 1000 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t4">
  <title id="t4">Two panels, each a key-value grid of three layers by six positions. They show what happens to the keys and values of the first five positions after a sixth token is appended to the sequence. On the left, the causal-masked stack: the first five columns are unchanged, only the new sixth column is added, and the measured deviation is exactly zero. On the right, the unmasked bidirectional stack: all five of the first columns have changed, and the measured deviation is 1.38. The left case is what makes the KV-cache possible; the right one leaves nothing stable to store.</title>
  <style>
    .ser { font-family: Georgia, 'Times New Roman', serif; }
    .mon { font-family: Consolas, Menlo, monospace; }
  </style>

  <text class="ser" x="90" y="56" font-size="15" fill="#1a1a1a">Causal mask</text>
  <text class="ser" x="90" y="74" font-size="12.6" font-style="italic" fill="#6e6e6e">past keys and values stay in place</text>
  <rect x="100" y="122" width="48" height="34" fill="none" stroke="#dadada" stroke-width="1"/><rect x="152" y="122" width="48" height="34" fill="none" stroke="#dadada" stroke-width="1"/><rect x="204" y="122" width="48" height="34" fill="none" stroke="#dadada" stroke-width="1"/><rect x="256" y="122" width="48" height="34" fill="none" stroke="#dadada" stroke-width="1"/><rect x="308" y="122" width="48" height="34" fill="none" stroke="#dadada" stroke-width="1"/><rect x="360" y="122" width="48" height="34" fill="#f7f7f5" stroke="#1a1a1a" stroke-width="1"/><rect x="100" y="164" width="48" height="34" fill="none" stroke="#dadada" stroke-width="1"/><rect x="152" y="164" width="48" height="34" fill="none" stroke="#dadada" stroke-width="1"/><rect x="204" y="164" width="48" height="34" fill="none" stroke="#dadada" stroke-width="1"/><rect x="256" y="164" width="48" height="34" fill="none" stroke="#dadada" stroke-width="1"/><rect x="308" y="164" width="48" height="34" fill="none" stroke="#dadada" stroke-width="1"/><rect x="360" y="164" width="48" height="34" fill="#f7f7f5" stroke="#1a1a1a" stroke-width="1"/><rect x="100" y="206" width="48" height="34" fill="none" stroke="#dadada" stroke-width="1"/><rect x="152" y="206" width="48" height="34" fill="none" stroke="#dadada" stroke-width="1"/><rect x="204" y="206" width="48" height="34" fill="none" stroke="#dadada" stroke-width="1"/><rect x="256" y="206" width="48" height="34" fill="none" stroke="#dadada" stroke-width="1"/><rect x="308" y="206" width="48" height="34" fill="none" stroke="#dadada" stroke-width="1"/><rect x="360" y="206" width="48" height="34" fill="#f7f7f5" stroke="#1a1a1a" stroke-width="1"/><text class="mon" x="90" y="144" font-size="10.8" fill="#6e6e6e" text-anchor="end">ℓ3</text><text class="mon" x="90" y="186" font-size="10.8" fill="#6e6e6e" text-anchor="end">ℓ2</text><text class="mon" x="90" y="228" font-size="10.8" fill="#6e6e6e" text-anchor="end">ℓ1</text><text class="mon" x="124" y="112" font-size="10.8" fill="#6e6e6e" text-anchor="middle">1</text><text class="mon" x="176" y="112" font-size="10.8" fill="#6e6e6e" text-anchor="middle">2</text><text class="mon" x="228" y="112" font-size="10.8" fill="#6e6e6e" text-anchor="middle">3</text><text class="mon" x="280" y="112" font-size="10.8" fill="#6e6e6e" text-anchor="middle">4</text><text class="mon" x="332" y="112" font-size="10.8" fill="#6e6e6e" text-anchor="middle">5</text><text class="mon" x="384" y="112" font-size="10.8" fill="#6e6e6e" text-anchor="middle">6</text>
  <text class="mon" x="100" y="272" font-size="12.6" fill="#1a1a1a">deviation = 0.00e+00</text>
  <text class="ser" x="100" y="292" font-size="12.6" font-style="italic" fill="#454545">Not approximate — <tspan font-style="normal">exactly</tspan> zero: the same expression</text>
  <text class="ser" x="100" y="308" font-size="12.6" font-style="italic" fill="#454545">is recomputed identically, without even floating-point error.</text>

  <line x1="500" y1="44" x2="500" y2="320" stroke="#dadada" stroke-width="1"/>

  <text class="ser" x="550" y="56" font-size="15" fill="#1a1a1a">No mask</text>
  <text class="ser" x="550" y="74" font-size="12.6" font-style="italic" fill="#6e6e6e">every position depends on the whole sequence</text>
  <rect x="560" y="122" width="48" height="34" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><rect x="612" y="122" width="48" height="34" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><rect x="664" y="122" width="48" height="34" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><rect x="716" y="122" width="48" height="34" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><rect x="768" y="122" width="48" height="34" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><rect x="820" y="122" width="48" height="34" fill="#f7f7f5" stroke="#1a1a1a" stroke-width="1"/><rect x="560" y="164" width="48" height="34" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><rect x="612" y="164" width="48" height="34" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><rect x="664" y="164" width="48" height="34" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><rect x="716" y="164" width="48" height="34" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><rect x="768" y="164" width="48" height="34" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><rect x="820" y="164" width="48" height="34" fill="#f7f7f5" stroke="#1a1a1a" stroke-width="1"/><rect x="560" y="206" width="48" height="34" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><rect x="612" y="206" width="48" height="34" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><rect x="664" y="206" width="48" height="34" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><rect x="716" y="206" width="48" height="34" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><rect x="768" y="206" width="48" height="34" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/><rect x="820" y="206" width="48" height="34" fill="#f7f7f5" stroke="#1a1a1a" stroke-width="1"/><text class="mon" x="550" y="144" font-size="10.8" fill="#6e6e6e" text-anchor="end">ℓ3</text><text class="mon" x="550" y="186" font-size="10.8" fill="#6e6e6e" text-anchor="end">ℓ2</text><text class="mon" x="550" y="228" font-size="10.8" fill="#6e6e6e" text-anchor="end">ℓ1</text><text class="mon" x="584" y="112" font-size="10.8" fill="#6e6e6e" text-anchor="middle">1</text><text class="mon" x="636" y="112" font-size="10.8" fill="#6e6e6e" text-anchor="middle">2</text><text class="mon" x="688" y="112" font-size="10.8" fill="#6e6e6e" text-anchor="middle">3</text><text class="mon" x="740" y="112" font-size="10.8" fill="#6e6e6e" text-anchor="middle">4</text><text class="mon" x="792" y="112" font-size="10.8" fill="#6e6e6e" text-anchor="middle">5</text><text class="mon" x="844" y="112" font-size="10.8" fill="#6e6e6e" text-anchor="middle">6</text>
  <text class="mon" x="560" y="272" font-size="12.6" fill="#8c1515">deviation = 1.38e+00</text>
  <text class="ser" x="560" y="292" font-size="12.6" font-style="italic" fill="#454545">Adding a single token changes everything from the</text>
  <text class="ser" x="560" y="308" font-size="12.6" font-style="italic" fill="#454545">second layer on — nothing stable is left to cache.</text>

  <g class="mon" font-size="10.8" fill="#6e6e6e">
    <rect x="90" y="334" width="11" height="9" fill="none" stroke="#dadada" stroke-width="1"/>
    <text x="108" y="342">unchanged</text>
    <rect x="196" y="334" width="11" height="9" fill="#f0dcdc" stroke="#8c1515" stroke-width="1"/>
    <text x="214" y="342">changed</text>
    <rect x="288" y="334" width="11" height="9" fill="#f7f7f5" stroke="#1a1a1a" stroke-width="1"/>
    <text x="306" y="342">new token</text>
    <text x="410" y="342">ℓ = layer</text>
  </g>
</svg>
