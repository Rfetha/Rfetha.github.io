<svg viewBox="0 0 1000 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1">
  <title id="t1">Timeline, 2017 to 2025. Mechanisms that entered the Transformer block after the fact, placed by arXiv publication date and split into five lanes by the pressure they answer: decode memory and bandwidth (MQA, sliding window, GQA, PagedAttention, MLA), compute per parameter (sparsely-gated MoE, Switch, DeepSeekMoE), training stability (RMSNorm, Pre-LN, QK-Norm, ViT-22B, attention sink), context length (RoPE, NoPE) and unnamed (SwiGLU). The vertical line marks the 2017 Transformer paper; sparsely-gated MoE sits five months to the left of it.</title>
  <style>
    .ser { font-family: Georgia, 'Times New Roman', serif; }
    .mon { font-family: Consolas, Menlo, monospace; }
  </style>

  <!-- ================= time axis ================= -->
  <line x1="190" y1="62" x2="970" y2="62" stroke="#dadada" stroke-width="1"/>

  <g class="mon" font-size="12" fill="#6e6e6e" text-anchor="middle">
    <text x="214" y="50">2017</text>
    <text x="308" y="50">2018</text>
    <text x="403" y="50">2019</text>
    <text x="497" y="50">2020</text>
    <text x="592" y="50">2021</text>
    <text x="686" y="50">2022</text>
    <text x="781" y="50">2023</text>
    <text x="876" y="50">2024</text>
    <text x="970" y="50">2025</text>
  </g>
  <g stroke="#dadada" stroke-width="1">
    <line x1="214" y1="58" x2="214" y2="66"/>
    <line x1="308" y1="58" x2="308" y2="66"/>
    <line x1="403" y1="58" x2="403" y2="66"/>
    <line x1="497" y1="58" x2="497" y2="66"/>
    <line x1="592" y1="58" x2="592" y2="66"/>
    <line x1="686" y1="58" x2="686" y2="66"/>
    <line x1="781" y1="58" x2="781" y2="66"/>
    <line x1="876" y1="58" x2="876" y2="66"/>
    <line x1="970" y1="58" x2="970" y2="66"/>
  </g>

  <!-- ================= 2017 anchor ================= -->
  <line x1="256" y1="66" x2="256" y2="418" stroke="#1a1a1a" stroke-width="1.2"/>
  <text class="ser" x="262" y="82" font-size="13.8" fill="#1a1a1a">Transformer</text>
  <text class="ser" x="262" y="96" font-size="12" font-style="italic" fill="#6e6e6e">2017 · the block's recipe</text>

  <!-- ================= lane labels ================= -->
  <g text-anchor="end">
    <text class="ser" x="172" y="126" font-size="13.2" fill="#1a1a1a">Decode memory and</text>
    <text class="ser" x="172" y="140" font-size="13.2" fill="#1a1a1a">bandwidth</text>
    <text class="mon" x="172" y="155" font-size="11.4" fill="#6e6e6e">§3, §4</text>

    <text class="ser" x="172" y="202" font-size="13.2" fill="#1a1a1a">Compute per</text>
    <text class="ser" x="172" y="216" font-size="13.2" fill="#1a1a1a">parameter</text>
    <text class="mon" x="172" y="231" font-size="11.4" fill="#6e6e6e">§6</text>

    <text class="ser" x="172" y="278" font-size="13.2" fill="#1a1a1a">Training stability</text>
    <text class="mon" x="172" y="293" font-size="11.4" fill="#6e6e6e">§5, §7</text>

    <text class="ser" x="172" y="346" font-size="13.2" fill="#1a1a1a">Context length</text>
    <text class="mon" x="172" y="361" font-size="11.4" fill="#6e6e6e">§5</text>

    <text class="ser" x="172" y="408" font-size="13.2" font-style="italic" fill="#6e6e6e">Unnamed</text>
    <text class="mon" x="172" y="423" font-size="11.4" fill="#6e6e6e">§8</text>
  </g>

  <!-- ================= lane lines ================= -->
  <g stroke="#dadada" stroke-width="1">
    <line x1="190" y1="136" x2="970" y2="136"/>
    <line x1="190" y1="212" x2="970" y2="212"/>
    <line x1="190" y1="284" x2="970" y2="284"/>
    <line x1="190" y1="352" x2="970" y2="352"/>
    <line x1="190" y1="404" x2="970" y2="404"/>
  </g>

  <!-- ================= 1. decode memory ================= -->
  <g fill="#1a1a1a">
    <circle cx="483" cy="136" r="3.4"/>
    <circle cx="523" cy="136" r="3.4"/>
    <circle cx="818" cy="136" r="3.4"/>
    <circle cx="852" cy="136" r="3.4"/>
    <circle cx="909" cy="136" r="3.4"/>
  </g>
  <g class="mon" font-size="12" fill="#454545" text-anchor="middle">
    <text x="483" y="124">MQA</text>
    <text x="818" y="124">GQA</text>
    <text x="909" y="124">MLA</text>
  </g>
  <g class="mon" font-size="12" fill="#454545" text-anchor="middle">
    <text x="527" y="152">sliding window</text>
    <text x="856" y="168">PagedAttention</text>
  </g>
  <line x1="852" y1="140" x2="852" y2="158" stroke="#dadada" stroke-width="1"/>

  <!-- ================= 2. compute per parameter ================= -->
  <circle cx="219" cy="212" r="4.2" fill="#8c1515"/>
  <g fill="#1a1a1a">
    <circle cx="595" cy="212" r="3.4"/>
    <circle cx="878" cy="212" r="3.4"/>
  </g>
  <text class="mon" x="219" y="200" font-size="12" fill="#8c1515" text-anchor="middle">MoE</text>
  <text class="ser" x="219" y="234" font-size="11.4" font-style="italic" fill="#8c1515" text-anchor="middle">5 months earlier</text>
  <g class="mon" font-size="12" fill="#454545" text-anchor="middle">
    <text x="595" y="200">Switch</text>
    <text x="878" y="200">DeepSeekMoE</text>
  </g>

  <!-- ================= 3. training stability ================= -->
  <g fill="#1a1a1a">
    <circle cx="477" cy="284" r="3.4"/>
    <circle cx="508" cy="284" r="3.4"/>
    <circle cx="570" cy="284" r="3.4"/>
    <circle cx="791" cy="284" r="3.4"/>
    <circle cx="852" cy="284" r="3.4"/>
  </g>
  <g class="mon" font-size="12" fill="#454545" text-anchor="middle">
    <text x="470" y="272">RMSNorm</text>
    <text x="570" y="272">QK-Norm</text>
    <text x="857" y="272">attention sink</text>
  </g>
  <g class="mon" font-size="12" fill="#454545" text-anchor="middle">
    <text x="512" y="300">Pre-LN</text>
    <text x="791" y="300">ViT-22B</text>
  </g>

  <!-- ================= 4. context length ================= -->
  <g fill="#1a1a1a">
    <circle cx="620" cy="352" r="3.4"/>
    <circle cx="820" cy="352" r="3.4"/>
  </g>
  <g class="mon" font-size="12" fill="#454545" text-anchor="middle">
    <text x="620" y="340">RoPE</text>
    <text x="820" y="340">NoPE</text>
  </g>

  <!-- ================= 5. unnamed ================= -->
  <circle cx="508" cy="404" r="3.4" fill="#1a1a1a"/>
  <text class="mon" x="508" y="392" font-size="12" fill="#454545" text-anchor="middle">SwiGLU</text>

  <!-- ================= footnote ================= -->
  <text class="ser" x="190" y="444" font-size="12" font-style="italic" fill="#6e6e6e">Dates are arXiv v1 submission dates. The lane is the pressure the mechanism answers; mechanisms are marked, not models.</text>
</svg>
