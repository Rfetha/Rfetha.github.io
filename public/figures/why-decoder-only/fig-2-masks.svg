<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2">
  <title id="t2">Three attention masks over the same 6-token sequence: fully-visible (every cell open), causal (lower triangle open), and prefix-causal (first two columns open to all rows, causal after).</title>
  <style>
    .ser { font-family: Georgia, 'Times New Roman', serif; }
    .mon { font-family: Consolas, Menlo, monospace; }
    .open { fill: #e3e6ea; stroke: #ffffff; stroke-width: 1.5; }
    .shut { fill: #ffffff; stroke: #ececec; stroke-width: 1.5; }
    .pfx  { fill: #cfd4db; stroke: #ffffff; stroke-width: 1.5; }
  </style>

  <!-- ============ panel 1: fully-visible ============ -->
  <g transform="translate(48,64)">
    <text class="ser" x="72" y="-30" font-size="14" fill="#1a1a1a" text-anchor="middle">fully-visible</text>
    <text class="mon" x="72" y="-13" font-size="10.5" fill="#6e6e6e" text-anchor="middle">prefix_len = n</text>
    <!-- 6x6 grid, all open -->
    <g>
      <rect class="open" x="0"  y="0"  width="24" height="24"/><rect class="open" x="24" y="0"  width="24" height="24"/><rect class="open" x="48" y="0"  width="24" height="24"/><rect class="open" x="72" y="0"  width="24" height="24"/><rect class="open" x="96" y="0"  width="24" height="24"/><rect class="open" x="120" y="0" width="24" height="24"/>
      <rect class="open" x="0"  y="24" width="24" height="24"/><rect class="open" x="24" y="24" width="24" height="24"/><rect class="open" x="48" y="24" width="24" height="24"/><rect class="open" x="72" y="24" width="24" height="24"/><rect class="open" x="96" y="24" width="24" height="24"/><rect class="open" x="120" y="24" width="24" height="24"/>
      <rect class="open" x="0"  y="48" width="24" height="24"/><rect class="open" x="24" y="48" width="24" height="24"/><rect class="open" x="48" y="48" width="24" height="24"/><rect class="open" x="72" y="48" width="24" height="24"/><rect class="open" x="96" y="48" width="24" height="24"/><rect class="open" x="120" y="48" width="24" height="24"/>
      <rect class="open" x="0"  y="72" width="24" height="24"/><rect class="open" x="24" y="72" width="24" height="24"/><rect class="open" x="48" y="72" width="24" height="24"/><rect class="open" x="72" y="72" width="24" height="24"/><rect class="open" x="96" y="72" width="24" height="24"/><rect class="open" x="120" y="72" width="24" height="24"/>
      <rect class="open" x="0"  y="96" width="24" height="24"/><rect class="open" x="24" y="96" width="24" height="24"/><rect class="open" x="48" y="96" width="24" height="24"/><rect class="open" x="72" y="96" width="24" height="24"/><rect class="open" x="96" y="96" width="24" height="24"/><rect class="open" x="120" y="96" width="24" height="24"/>
      <rect class="open" x="0"  y="120" width="24" height="24"/><rect class="open" x="24" y="120" width="24" height="24"/><rect class="open" x="48" y="120" width="24" height="24"/><rect class="open" x="72" y="120" width="24" height="24"/><rect class="open" x="96" y="120" width="24" height="24"/><rect class="open" x="120" y="120" width="24" height="24"/>
    </g>
    <text class="ser" x="72" y="166" font-size="11" fill="#454545" text-anchor="middle">BERT</text>
  </g>

  <!-- ============ panel 2: causal ============ -->
  <g transform="translate(278,64)">
    <text class="ser" x="72" y="-30" font-size="14" fill="#1a1a1a" text-anchor="middle">causal</text>
    <text class="mon" x="72" y="-13" font-size="10.5" fill="#6e6e6e" text-anchor="middle">prefix_len = 0</text>
    <g>
      <rect class="open" x="0"  y="0"  width="24" height="24"/><rect class="shut" x="24" y="0"  width="24" height="24"/><rect class="shut" x="48" y="0"  width="24" height="24"/><rect class="shut" x="72" y="0"  width="24" height="24"/><rect class="shut" x="96" y="0"  width="24" height="24"/><rect class="shut" x="120" y="0" width="24" height="24"/>
      <rect class="open" x="0"  y="24" width="24" height="24"/><rect class="open" x="24" y="24" width="24" height="24"/><rect class="shut" x="48" y="24" width="24" height="24"/><rect class="shut" x="72" y="24" width="24" height="24"/><rect class="shut" x="96" y="24" width="24" height="24"/><rect class="shut" x="120" y="24" width="24" height="24"/>
      <rect class="open" x="0"  y="48" width="24" height="24"/><rect class="open" x="24" y="48" width="24" height="24"/><rect class="open" x="48" y="48" width="24" height="24"/><rect class="shut" x="72" y="48" width="24" height="24"/><rect class="shut" x="96" y="48" width="24" height="24"/><rect class="shut" x="120" y="48" width="24" height="24"/>
      <rect class="open" x="0"  y="72" width="24" height="24"/><rect class="open" x="24" y="72" width="24" height="24"/><rect class="open" x="48" y="72" width="24" height="24"/><rect class="open" x="72" y="72" width="24" height="24"/><rect class="shut" x="96" y="72" width="24" height="24"/><rect class="shut" x="120" y="72" width="24" height="24"/>
      <rect class="open" x="0"  y="96" width="24" height="24"/><rect class="open" x="24" y="96" width="24" height="24"/><rect class="open" x="48" y="96" width="24" height="24"/><rect class="open" x="72" y="96" width="24" height="24"/><rect class="open" x="96" y="96" width="24" height="24"/><rect class="shut" x="120" y="96" width="24" height="24"/>
      <rect class="open" x="0"  y="120" width="24" height="24"/><rect class="open" x="24" y="120" width="24" height="24"/><rect class="open" x="48" y="120" width="24" height="24"/><rect class="open" x="72" y="120" width="24" height="24"/><rect class="open" x="96" y="120" width="24" height="24"/><rect class="open" x="120" y="120" width="24" height="24"/>
    </g>
    <text class="ser" x="72" y="166" font-size="11" fill="#454545" text-anchor="middle">GPT</text>
  </g>

  <!-- ============ panel 3: prefix-causal ============ -->
  <g transform="translate(508,64)">
    <text class="ser" x="72" y="-30" font-size="14" fill="#1a1a1a" text-anchor="middle">prefix-causal</text>
    <text class="mon" x="72" y="-13" font-size="10.5" fill="#6e6e6e" text-anchor="middle">prefix_len = 2</text>
    <g>
      <rect class="pfx"  x="0"  y="0"  width="24" height="24"/><rect class="pfx"  x="24" y="0"  width="24" height="24"/><rect class="shut" x="48" y="0"  width="24" height="24"/><rect class="shut" x="72" y="0"  width="24" height="24"/><rect class="shut" x="96" y="0"  width="24" height="24"/><rect class="shut" x="120" y="0" width="24" height="24"/>
      <rect class="pfx"  x="0"  y="24" width="24" height="24"/><rect class="pfx"  x="24" y="24" width="24" height="24"/><rect class="shut" x="48" y="24" width="24" height="24"/><rect class="shut" x="72" y="24" width="24" height="24"/><rect class="shut" x="96" y="24" width="24" height="24"/><rect class="shut" x="120" y="24" width="24" height="24"/>
      <rect class="pfx"  x="0"  y="48" width="24" height="24"/><rect class="pfx"  x="24" y="48" width="24" height="24"/><rect class="open" x="48" y="48" width="24" height="24"/><rect class="shut" x="72" y="48" width="24" height="24"/><rect class="shut" x="96" y="48" width="24" height="24"/><rect class="shut" x="120" y="48" width="24" height="24"/>
      <rect class="pfx"  x="0"  y="72" width="24" height="24"/><rect class="pfx"  x="24" y="72" width="24" height="24"/><rect class="open" x="48" y="72" width="24" height="24"/><rect class="open" x="72" y="72" width="24" height="24"/><rect class="shut" x="96" y="72" width="24" height="24"/><rect class="shut" x="120" y="72" width="24" height="24"/>
      <rect class="pfx"  x="0"  y="96" width="24" height="24"/><rect class="pfx"  x="24" y="96" width="24" height="24"/><rect class="open" x="48" y="96" width="24" height="24"/><rect class="open" x="72" y="96" width="24" height="24"/><rect class="open" x="96" y="96" width="24" height="24"/><rect class="shut" x="120" y="96" width="24" height="24"/>
      <rect class="pfx"  x="0"  y="120" width="24" height="24"/><rect class="pfx"  x="24" y="120" width="24" height="24"/><rect class="open" x="48" y="120" width="24" height="24"/><rect class="open" x="72" y="120" width="24" height="24"/><rect class="open" x="96" y="120" width="24" height="24"/><rect class="open" x="120" y="120" width="24" height="24"/>
    </g>
    <!-- prefix bracket -->
    <path d="M0,150 H48" stroke="#8c1515" stroke-width="1.2"/>
    <path d="M0,150 v-4 M48,150 v-4" stroke="#8c1515" stroke-width="1.2"/>
    <text class="ser" x="24" y="164" font-size="10" fill="#8c1515" text-anchor="middle">prefix</text>
    <text class="ser" x="104" y="166" font-size="11" fill="#454545" text-anchor="middle">T5 prefix-LM</text>
  </g>

  <!-- axis labels (shared) -->
  <text class="ser" x="20" y="132" font-size="10.5" fill="#6e6e6e" text-anchor="middle" transform="rotate(-90 20 132)">query i</text>
  <text class="ser" x="120" y="36" font-size="10.5" fill="#6e6e6e" text-anchor="middle">key j &#8594;</text>

  <!-- legend -->
  <g transform="translate(48,262)">
    <rect class="open" x="0" y="0" width="14" height="14"/>
    <text class="ser" x="22" y="11" font-size="11" fill="#454545">open (0)</text>
    <rect class="shut" x="104" y="0" width="14" height="14"/>
    <text class="ser" x="126" y="11" font-size="11" fill="#454545">masked (&#8722;&#8734;)</text>
    <rect class="pfx" x="234" y="0" width="14" height="14"/>
    <text class="ser" x="256" y="11" font-size="11" fill="#454545">open via prefix</text>
  </g>
</svg>
