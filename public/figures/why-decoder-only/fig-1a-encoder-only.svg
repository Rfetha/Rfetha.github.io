<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1a">
  <title id="t1a">Encoder-only architecture: input tokens flow through a fully-visible self-attention stack into per-token representations, consumed by a classification or retrieval head.</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0.6 L7.4,4 L0,7.4 Z" fill="#454545"/>
    </marker>
  </defs>
  <style>
    .ser { font-family: Georgia, 'Times New Roman', serif; }
    .mon { font-family: Consolas, Menlo, monospace; }
  </style>

  <!-- input tokens -->
  <g class="mon" font-size="13" fill="#454545" text-anchor="middle">
    <rect x="128" y="234" width="44" height="28" rx="4" fill="#f7f7f5" stroke="#dadada"/>
    <rect x="188" y="234" width="44" height="28" rx="4" fill="#f7f7f5" stroke="#dadada"/>
    <rect x="248" y="234" width="44" height="28" rx="4" fill="#f7f7f5" stroke="#dadada"/>
    <rect x="308" y="234" width="44" height="28" rx="4" fill="#f7f7f5" stroke="#dadada"/>
    <text x="150" y="253">x&#8321;</text><text x="210" y="253">x&#8322;</text>
    <text x="270" y="253">x&#8323;</text><text x="330" y="253">x&#8324;</text>
  </g>

  <!-- arrows tokens -> stack -->
  <g stroke="#454545" stroke-width="1.4" marker-end="url(#arr)">
    <line x1="150" y1="232" x2="150" y2="200"/>
    <line x1="210" y1="232" x2="210" y2="200"/>
    <line x1="270" y1="232" x2="270" y2="200"/>
    <line x1="330" y1="232" x2="330" y2="200"/>
  </g>

  <!-- encoder stack -->
  <rect x="108" y="132" width="264" height="64" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text class="ser" x="240" y="158" font-size="15" fill="#1a1a1a" text-anchor="middle">Encoder stack</text>
  <text class="ser" x="240" y="178" font-size="11" fill="#6e6e6e" text-anchor="middle">N &#215; self-attention &#8212; fully-visible</text>

  <!-- arrows stack -> representations -->
  <g stroke="#454545" stroke-width="1.4" marker-end="url(#arr)">
    <line x1="150" y1="130" x2="150" y2="104"/>
    <line x1="210" y1="130" x2="210" y2="104"/>
    <line x1="270" y1="130" x2="270" y2="104"/>
    <line x1="330" y1="130" x2="330" y2="104"/>
  </g>

  <!-- representations -->
  <g class="mon" font-size="11" fill="#454545" text-anchor="middle">
    <rect x="128" y="80" width="44" height="22" rx="4" fill="#ececec" stroke="#dadada"/>
    <rect x="188" y="80" width="44" height="22" rx="4" fill="#ececec" stroke="#dadada"/>
    <rect x="248" y="80" width="44" height="22" rx="4" fill="#ececec" stroke="#dadada"/>
    <rect x="308" y="80" width="44" height="22" rx="4" fill="#ececec" stroke="#dadada"/>
    <text x="150" y="95">h&#8321;</text><text x="210" y="95">h&#8322;</text>
    <text x="270" y="95">h&#8323;</text><text x="330" y="95">h&#8324;</text>
  </g>
  <text class="ser" x="240" y="66" font-size="11" fill="#6e6e6e" text-anchor="middle">one representation per token</text>

  <!-- head -->
  <line x1="354" y1="91" x2="452" y2="91" stroke="#454545" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="456" y="66" width="152" height="50" rx="6" fill="#f7f7f5" stroke="#dadada"/>
  <text class="ser" x="532" y="87" font-size="12.5" fill="#454545" text-anchor="middle">classification /</text>
  <text class="ser" x="532" y="103" font-size="12.5" fill="#454545" text-anchor="middle">retrieval head</text>

  <!-- annotation -->
  <path d="M132,286 H348" stroke="#dadada" stroke-width="1"/>
  <text class="ser" x="240" y="282" font-size="11" font-style="italic" fill="#6e6e6e" text-anchor="middle">every token attends to every token &#8212; both directions</text>
</svg>
