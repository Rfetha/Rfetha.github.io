<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t0">
  <title id="t0">The 2017 Transformer in full: an encoder stack of self-attention and feed-forward sub-layers, and a decoder stack that adds a masked self-attention sub-layer and a cross-attention sub-layer reading the encoder output, ending in a linear projection and softmax.</title>
  <defs>
    <marker id="a0" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0.6 L7.4,4 L0,7.4 Z" fill="#454545"/>
    </marker>
    <marker id="a0x" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0.6 L7.4,4 L0,7.4 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="a0r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0.6 L7.4,4 L0,7.4 Z" fill="#9a9a9a"/>
    </marker>
  </defs>
  <style>
    .ser { font-family: Georgia, 'Times New Roman', serif; }
    .sub { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.4; }
    .nrm { fill: #ececec; stroke: #c9c9c9; stroke-width: 1; }
    .emb { fill: #f7f7f5; stroke: #dadada; stroke-width: 1; }
    .lb  { font-family: Georgia, serif; font-size: 13px; fill: #1a1a1a; }
    .lbs { font-family: Georgia, serif; font-size: 11.5px; fill: #454545; }
    .tag { font-family: Georgia, serif; font-size: 11px; fill: #6e6e6e; }
    .flow { stroke: #454545; stroke-width: 1.4; fill: none; }
    .res  { stroke: #9a9a9a; stroke-width: 1; fill: none; }
  </style>

  <!-- ══════════ ENCODER ══════════ -->
  <text class="ser" x="280" y="30" font-size="15" fill="#1a1a1a" text-anchor="middle">Encoder</text>
  <text class="tag" x="280" y="48" text-anchor="middle">girdiyi okur &#183; fully-visible</text>

  <!-- N x container -->
  <rect x="128" y="330" width="304" height="222" fill="none" stroke="#dadada" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="tag" x="120" y="446" text-anchor="end">N &#215;</text>

  <!-- encoder sublayers -->
  <rect class="sub" x="158" y="490" width="244" height="38"/>
  <text class="lb" x="280" y="514" text-anchor="middle">Multi-Head Self-Attention</text>
  <rect class="nrm" x="158" y="452" width="244" height="26"/>
  <text class="lbs" x="280" y="470" text-anchor="middle">Add &amp; Norm</text>

  <rect class="sub" x="158" y="388" width="244" height="38"/>
  <text class="lb" x="280" y="412" text-anchor="middle">Feed Forward</text>
  <rect class="nrm" x="158" y="350" width="244" height="26"/>
  <text class="lbs" x="280" y="368" text-anchor="middle">Add &amp; Norm</text>

  <!-- encoder flow -->
  <line class="flow" x1="280" y1="490" x2="280" y2="482" marker-end="url(#a0)"/>
  <line class="flow" x1="280" y1="452" x2="280" y2="432" marker-end="url(#a0)"/>
  <line class="flow" x1="280" y1="388" x2="280" y2="380" marker-end="url(#a0)"/>
  <line class="flow" x1="280" y1="350" x2="280" y2="306" marker-end="url(#a0)"/>

  <!-- encoder residuals -->
  <path class="res" d="M150,534 C118,534 118,466 152,466" marker-end="url(#a0r)"/>
  <path class="res" d="M150,432 C118,432 118,364 152,364" marker-end="url(#a0r)"/>

  <!-- encoder input -->
  <circle cx="280" cy="576" r="11" fill="#ffffff" stroke="#454545" stroke-width="1.2"/>
  <line x1="273" y1="576" x2="287" y2="576" stroke="#454545" stroke-width="1.2"/>
  <line x1="280" y1="569" x2="280" y2="583" stroke="#454545" stroke-width="1.2"/>
  <line class="flow" x1="280" y1="565" x2="280" y2="536" marker-end="url(#a0)"/>
  <text class="lbs" x="150" y="580" text-anchor="end">Positional Encoding</text>
  <line class="flow" x1="156" y1="576" x2="265" y2="576" marker-end="url(#a0)"/>

  <rect class="emb" x="158" y="606" width="244" height="34"/>
  <text class="lbs" x="280" y="628" text-anchor="middle">Input Embedding</text>
  <line class="flow" x1="280" y1="606" x2="280" y2="590" marker-end="url(#a0)"/>
  <text class="tag" x="280" y="666" text-anchor="middle">girdi token'lar&#305;</text>
  <line class="flow" x1="280" y1="652" x2="280" y2="644" marker-end="url(#a0)"/>

  <!-- ══════════ DECODER ══════════ -->
  <text class="ser" x="720" y="30" font-size="15" fill="#1a1a1a" text-anchor="middle">Decoder</text>
  <text class="tag" x="720" y="48" text-anchor="middle">&#231;&#305;kt&#305;y&#305; &#252;retir &#183; causal</text>

  <rect x="568" y="192" width="304" height="360" fill="none" stroke="#dadada" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="tag" x="560" y="376" text-anchor="end">N &#215;</text>

  <rect class="sub" x="598" y="490" width="244" height="38"/>
  <text class="lb" x="720" y="514" text-anchor="middle">Masked Self-Attention</text>
  <rect class="nrm" x="598" y="452" width="244" height="26"/>
  <text class="lbs" x="720" y="470" text-anchor="middle">Add &amp; Norm</text>

  <rect class="sub" x="598" y="388" width="244" height="38" stroke="#8c1515"/>
  <text class="lb" x="720" y="412" text-anchor="middle" fill="#8c1515">Cross-Attention</text>
  <rect class="nrm" x="598" y="350" width="244" height="26"/>
  <text class="lbs" x="720" y="368" text-anchor="middle">Add &amp; Norm</text>

  <rect class="sub" x="598" y="286" width="244" height="38"/>
  <text class="lb" x="720" y="310" text-anchor="middle">Feed Forward</text>
  <rect class="nrm" x="598" y="248" width="244" height="26"/>
  <text class="lbs" x="720" y="266" text-anchor="middle">Add &amp; Norm</text>

  <!-- decoder flow -->
  <line class="flow" x1="720" y1="490" x2="720" y2="482" marker-end="url(#a0)"/>
  <line class="flow" x1="720" y1="452" x2="720" y2="432" marker-end="url(#a0)"/>
  <line class="flow" x1="720" y1="388" x2="720" y2="380" marker-end="url(#a0)"/>
  <line class="flow" x1="720" y1="350" x2="720" y2="330" marker-end="url(#a0)"/>
  <line class="flow" x1="720" y1="286" x2="720" y2="278" marker-end="url(#a0)"/>
  <line class="flow" x1="720" y1="248" x2="720" y2="164" marker-end="url(#a0)"/>

  <!-- decoder residuals -->
  <path class="res" d="M590,534 C558,534 558,466 592,466" marker-end="url(#a0r)"/>
  <path class="res" d="M590,432 C558,432 558,364 592,364" marker-end="url(#a0r)"/>
  <path class="res" d="M590,330 C558,330 558,262 592,262" marker-end="url(#a0r)"/>

  <!-- decoder input -->
  <circle cx="720" cy="576" r="11" fill="#ffffff" stroke="#454545" stroke-width="1.2"/>
  <line x1="713" y1="576" x2="727" y2="576" stroke="#454545" stroke-width="1.2"/>
  <line x1="720" y1="569" x2="720" y2="583" stroke="#454545" stroke-width="1.2"/>
  <line class="flow" x1="720" y1="565" x2="720" y2="536" marker-end="url(#a0)"/>
  <line class="flow" x1="596" y1="576" x2="705" y2="576" marker-end="url(#a0)"/>
  <text class="lbs" x="590" y="580" text-anchor="end">Positional Encoding</text>

  <rect class="emb" x="598" y="606" width="244" height="34"/>
  <text class="lbs" x="720" y="628" text-anchor="middle">Output Embedding</text>
  <line class="flow" x1="720" y1="606" x2="720" y2="590" marker-end="url(#a0)"/>
  <text class="tag" x="720" y="666" text-anchor="middle">&#351;u ana kadar &#252;retilenler (bir sa&#287;a kayd&#305;r&#305;lm&#305;&#351;)</text>
  <line class="flow" x1="720" y1="652" x2="720" y2="644" marker-end="url(#a0)"/>

  <!-- decoder head -->
  <rect class="emb" x="620" y="120" width="200" height="32"/>
  <text class="lbs" x="720" y="141" text-anchor="middle">Linear</text>
  <line class="flow" x1="720" y1="120" x2="720" y2="106" marker-end="url(#a0)"/>
  <rect class="emb" x="620" y="72" width="200" height="32"/>
  <text class="lbs" x="720" y="93" text-anchor="middle">Softmax</text>
  <line class="flow" x1="720" y1="72" x2="720" y2="60" marker-end="url(#a0)"/>
  <text class="tag" x="832" y="93">sonraki token da&#287;&#305;l&#305;m&#305;</text>

  <!-- ══════════ CROSS LINK ══════════ -->
  <path class="flow" d="M280,306 L280,286 C280,270 296,262 320,262 L520,262 C548,262 556,300 556,340 L556,400 L592,407"
        stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#a0x)"/>
  <text class="tag" x="418" y="252" text-anchor="middle" fill="#1a1a1a">encoder &#231;&#305;kt&#305;s&#305; &#8594; K, V</text>
</svg>
