<svg viewBox="0 0 660 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t6">
  <title id="t6">The same conversion graph with 2024–2025 systems named: LLM2Vec and Qwen3-Embedding convert a decoder-only checkpoint into an encoder; T5Gemma and T5Gemma 2 convert it into an encoder-decoder.</title>
  <defs>
    <marker id="ok6" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0.6 L7.4,4 L0,7.4 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <style>
    .ser { font-family: Georgia, 'Times New Roman', serif; }
    .mon { font-family: Consolas, Menlo, monospace; }
  </style>

  <!-- source node -->
  <rect x="30" y="104" width="168" height="64" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
  <text class="ser" x="114" y="130" font-size="13.5" fill="#1a1a1a" text-anchor="middle">decoder-only</text>
  <text class="ser" x="114" y="149" font-size="11" fill="#6e6e6e" text-anchor="middle">pretrained checkpoint</text>
  <text class="ser" x="114" y="186" font-size="10.5" font-style="italic" fill="#6e6e6e" text-anchor="middle">the one thing worth amortising</text>

  <!-- branch: to encoder -->
  <path d="M204,126 C280,110 320,86 380,80" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ok6)"/>
  <rect x="388" y="48" width="240" height="64" rx="4" fill="#f7f7f5" stroke="#dadada"/>
  <text class="ser" x="404" y="70" font-size="13" fill="#454545">as an encoder</text>
  <text class="mon" x="404" y="90" font-size="11" fill="#454545">LLM2Vec &#183; Qwen3-Embedding</text>
  <text class="ser" x="404" y="105" font-size="10.5" font-style="italic" fill="#8c1515">step 1: delete the causal mask</text>

  <!-- branch: to encoder-decoder -->
  <path d="M204,148 C280,166 320,190 380,198" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ok6)"/>
  <rect x="388" y="170" width="240" height="64" rx="4" fill="#f7f7f5" stroke="#dadada"/>
  <text class="ser" x="404" y="192" font-size="13" fill="#454545">as an encoder-decoder</text>
  <text class="mon" x="404" y="212" font-size="11" fill="#454545">T5Gemma &#183; T5Gemma 2</text>
  <text class="ser" x="404" y="227" font-size="10.5" font-style="italic" fill="#6e6e6e">adapted, not trained from scratch</text>

  <!-- closing note -->
  <text class="ser" x="330" y="266" font-size="11.5" fill="#454545" text-anchor="middle">Architecture stopped being an identity and became a conversion.</text>
</svg>
