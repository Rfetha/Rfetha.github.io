<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1c">
  <title id="t1c">Encoder-decoder architecture: a fully-visible encoder reads the input; a causal decoder writes the output, attending back to encoder representations through cross-attention.</title>
  <defs>
    <marker id="arrC" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0.6 L7.4,4 L0,7.4 Z" fill="#454545"/>
    </marker>
    <marker id="arrX" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0.6 L7.4,4 L0,7.4 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <style>
    .ser { font-family: Georgia, 'Times New Roman', serif; }
    .mon { font-family: Consolas, Menlo, monospace; }
  </style>

  <!-- ENCODER side -->
  <g class="mon" font-size="13" fill="#454545" text-anchor="middle">
    <rect x="48" y="252" width="44" height="28" rx="4" fill="#f7f7f5" stroke="#dadada"/>
    <rect x="108" y="252" width="44" height="28" rx="4" fill="#f7f7f5" stroke="#dadada"/>
    <rect x="168" y="252" width="44" height="28" rx="4" fill="#f7f7f5" stroke="#dadada"/>
    <text x="70" y="271">x&#8321;</text><text x="130" y="271">x&#8322;</text><text x="190" y="271">x&#8323;</text>
  </g>
  <g stroke="#454545" stroke-width="1.4" marker-end="url(#arrC)">
    <line x1="70" y1="250" x2="70" y2="222"/>
    <line x1="130" y1="250" x2="130" y2="222"/>
    <line x1="190" y1="250" x2="190" y2="222"/>
  </g>
  <rect x="36" y="158" width="188" height="60" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text class="ser" x="130" y="183" font-size="15" fill="#1a1a1a" text-anchor="middle">Encoder</text>
  <text class="ser" x="130" y="202" font-size="11" fill="#6e6e6e" text-anchor="middle">fully-visible</text>
  <g stroke="#454545" stroke-width="1.4" marker-end="url(#arrC)">
    <line x1="70" y1="156" x2="70" y2="128"/>
    <line x1="130" y1="156" x2="130" y2="128"/>
    <line x1="190" y1="156" x2="190" y2="128"/>
  </g>
  <g>
    <rect x="48" y="104" width="44" height="22" rx="4" fill="#ececec" stroke="#dadada"/>
    <rect x="108" y="104" width="44" height="22" rx="4" fill="#ececec" stroke="#dadada"/>
    <rect x="168" y="104" width="44" height="22" rx="4" fill="#ececec" stroke="#dadada"/>
  </g>
  <text class="ser" x="130" y="92" font-size="11" fill="#6e6e6e" text-anchor="middle">encoder representations (K, V)</text>

  <!-- DECODER side -->
  <g class="mon" font-size="13" fill="#454545" text-anchor="middle">
    <rect x="448" y="252" width="44" height="28" rx="4" fill="#f7f7f5" stroke="#dadada"/>
    <rect x="508" y="252" width="44" height="28" rx="4" fill="#f7f7f5" stroke="#dadada"/>
    <rect x="568" y="252" width="44" height="28" rx="4" fill="#ffffff" stroke="#dadada" stroke-dasharray="4 3"/>
    <text x="470" y="271">y&#8321;</text><text x="530" y="271">y&#8322;</text>
    <text x="590" y="271" fill="#6e6e6e">y&#8323;</text>
  </g>
  <g stroke="#454545" stroke-width="1.4" marker-end="url(#arrC)">
    <line x1="470" y1="250" x2="470" y2="222"/>
    <line x1="530" y1="250" x2="530" y2="222"/>
  </g>
  <rect x="436" y="158" width="208" height="60" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text class="ser" x="530" y="183" font-size="15" fill="#1a1a1a" text-anchor="middle">Decoder</text>
  <text class="ser" x="522" y="202" font-size="11" fill="#6e6e6e" text-anchor="middle">causal</text>
  <g fill="#8c1515" opacity="0.9">
    <rect x="556" y="192" width="4.5" height="4.5"/>
    <rect x="556" y="198" width="4.5" height="4.5"/><rect x="562" y="198" width="4.5" height="4.5"/>
    <rect x="556" y="204" width="4.5" height="4.5"/><rect x="562" y="204" width="4.5" height="4.5"/><rect x="568" y="204" width="4.5" height="4.5"/>
  </g>
  <line x1="540" y1="156" x2="540" y2="118" stroke="#454545" stroke-width="1.4" marker-end="url(#arrC)"/>
  <rect x="478" y="80" width="124" height="34" rx="6" fill="#f7f7f5" stroke="#dadada"/>
  <text class="mon" x="540" y="102" font-size="12.5" fill="#454545" text-anchor="middle">p(next token)</text>

  <!-- CROSS-ATTENTION -->
  <g stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#arrX)">
    <path d="M226,115 C320,120 370,160 432,176"/>
    <path d="M226,122 C320,132 370,170 432,186"/>
    <path d="M226,129 C320,144 370,180 432,196"/>
  </g>
  <text class="ser" x="352" y="86" font-size="12.5" fill="#1a1a1a" text-anchor="middle">cross-attention</text>
  <text class="ser" x="352" y="102" font-size="10.5" fill="#6e6e6e" text-anchor="middle">Q from decoder &#183; K, V from encoder</text>

  <!-- annotation -->
  <text class="ser" x="130" y="304" font-size="11" font-style="italic" fill="#6e6e6e" text-anchor="middle">read once, in both directions</text>
  <text class="ser" x="530" y="304" font-size="11" font-style="italic" fill="#6e6e6e" text-anchor="middle">write left to right, consulting the source</text>
</svg>
