<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1b">
  <title id="t1b">Decoder-only architecture: input tokens flow through a causal self-attention stack into a next-token distribution; the sampled token is appended to the input and the loop repeats.</title>
  <defs>
    <marker id="arrB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0.6 L7.4,4 L0,7.4 Z" fill="#454545"/>
    </marker>
    <marker id="arrR" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0.6 L7.4,4 L0,7.4 Z" fill="#6e6e6e"/>
    </marker>
  </defs>
  <style>
    .ser { font-family: Georgia, 'Times New Roman', serif; }
    .mon { font-family: Consolas, Menlo, monospace; }
  </style>

  <!-- input tokens -->
  <g class="mon" font-size="13" fill="#454545" text-anchor="middle">
    <rect x="128" y="234" width="44" height="28" rx="4" fill="#f7f7f5" stroke="#dadada"/>
    <rect x="188" y="234" width="44" height="28" rx="4" fill="#f7f7f5" stroke="#dadada"/>
    <rect x="248" y="234" width="44" height="28" rx="4" fill="#f7f7f5" stroke="#dadada"/>
    <rect x="308" y="234" width="44" height="28" rx="4" fill="#f7f7f5" stroke="#dadada"/>
    <text x="150" y="253">x&#8321;</text><text x="210" y="253">x&#8322;</text>
    <text x="270" y="253">x&#8323;</text><text x="330" y="253">x&#8324;</text>
    <!-- appended token, dashed -->
    <rect x="368" y="234" width="44" height="28" rx="4" fill="#ffffff" stroke="#8c1515" stroke-dasharray="4 3"/>
    <text x="390" y="253" fill="#8c1515">x&#8325;</text>
  </g>

  <!-- arrows tokens -> stack -->
  <g stroke="#454545" stroke-width="1.4" marker-end="url(#arrB)">
    <line x1="150" y1="232" x2="150" y2="200"/>
    <line x1="210" y1="232" x2="210" y2="200"/>
    <line x1="270" y1="232" x2="270" y2="200"/>
    <line x1="330" y1="232" x2="330" y2="200"/>
  </g>

  <!-- decoder stack -->
  <rect x="108" y="132" width="264" height="64" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text class="ser" x="240" y="158" font-size="15" fill="#1a1a1a" text-anchor="middle">Decoder stack</text>
  <text class="ser" x="234" y="178" font-size="11" fill="#6e6e6e" text-anchor="middle">N &#215; causal self-attention</text>
  <!-- causal mini-mask glyph -->
  <g fill="#8c1515" opacity="0.9">
    <rect x="316" y="168" width="4.5" height="4.5"/>
    <rect x="316" y="174" width="4.5" height="4.5"/><rect x="322" y="174" width="4.5" height="4.5"/>
    <rect x="316" y="180" width="4.5" height="4.5"/><rect x="322" y="180" width="4.5" height="4.5"/><rect x="328" y="180" width="4.5" height="4.5"/>
  </g>

  <!-- stack -> next-token distribution -->
  <line x1="330" y1="130" x2="330" y2="102" stroke="#454545" stroke-width="1.4" marker-end="url(#arrB)"/>
  <rect x="268" y="64" width="124" height="34" rx="6" fill="#f7f7f5" stroke="#dadada"/>
  <text class="mon" x="330" y="86" font-size="12.5" fill="#454545" text-anchor="middle">p(next token)</text>

  <!-- sample & append loop -->
  <path d="M396,81 C472,81 486,150 452,206 C438,229 424,238 414,243" fill="none" stroke="#6e6e6e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <text class="ser" x="500" y="146" font-size="11" font-style="italic" fill="#6e6e6e">sample &#8594; append</text>
  <text class="ser" x="500" y="162" font-size="11" font-style="italic" fill="#6e6e6e">&#8594; repeat</text>

  <!-- annotation -->
  <path d="M132,286 H348" stroke="#dadada" stroke-width="1"/>
  <text class="ser" x="240" y="282" font-size="11" font-style="italic" fill="#6e6e6e" text-anchor="middle">each token attends only to the past</text>
</svg>
